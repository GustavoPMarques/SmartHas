name: CI/CD Smart HAS


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes (back-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api/smarthas-api

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, testar e empacotar
        shell: bash
        run: |
          ./mvnw -B -ntp verify 2>&1 | tee mvn-verify.log

      - name: Resumo dos testes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          rows = []
          total = fail = err = skip = 0
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(path).getroot()
              n, f, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              rows.append((r.get("name"), n, f, e, s, r.get("time")))
              total += n
              fail += f
              err += e
              skip += s

          print("## Testes do back-end")
          print()
          print("**%d testes** | falhas: %d | erros: %d | ignorados: %d" % (total, fail, err, skip))
          print()
          print("| Classe | Testes | Falhas | Erros | Ignorados | Tempo (s) |")
          print("|---|---|---|---|---|---|")
          for row in rows:
              print("| `%s` | %d | %d | %d | %d | %s |" % row)
          PY

      - name: Publicar relatorios de teste e log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-backend
          path: |
            backend-api/smarthas-api/target/surefire-reports/
            backend-api/smarthas-api/mvn-verify.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar o jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: smarthas-api-jar
          path: backend-api/smarthas-api/target/*.jar
          if-no-files-found: error
          retention-days: 14

  oracle-db:
    name: Oracle (scripts e verificacoes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_PASSWORD: CiOracle2026x
      APP_PASSWORD: CiSmartHas2026x

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Subir o Oracle Free (container)
        run: |
          docker run -d --name oracle-ci \
            -e ORACLE_PASSWORD="$ORACLE_PASSWORD" \
            -e APP_USER=smarthas \
            -e APP_USER_PASSWORD="$APP_PASSWORD" \
            gvenzl/oracle-free:23-slim-faststart

      - name: Executar scripts 01 a 07 e verificacoes automaticas
        run: bash database/ci/run_ci.sh

      - name: Resumo das verificacoes do Oracle
        if: always()
        shell: bash
        run: |
          {
            echo "## Oracle: verificacoes automaticas"
            echo
            if [ -f ci-logs/assert_oracle.log ]; then
              echo '```'
              grep -E '^\[(OK|FALHA|ERRO)\]|^RESULTADO' ci-logs/assert_oracle.log || echo "sem saida"
              echo '```'
            else
              echo "As verificacoes nao chegaram a executar. Veja os logs dos scripts nos artefatos."
            fi
            echo
            echo "Logs completos de cada script: artefato **logs-oracle**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs dos scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-oracle
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Logs do container (somente se falhar)
        if: failure()
        run: docker logs --tail 80 oracle-ci || true
