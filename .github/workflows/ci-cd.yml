name: CI/CD Smart HAS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes (back-end)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api/smarthas-api

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Dar permissao ao Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, testar e empacotar
        shell: bash
        run: |
          ./mvnw -B -ntp verify 2>&1 | tee mvn-verify.log

      - name: Resumo dos testes
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          rows = []
          total = fail = err = skip = 0
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(path).getroot()
              n, f, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              rows.append((r.get("name"), n, f, e, s, r.get("time")))
              total += n
              fail += f
              err += e
              skip += s

          print("## Testes do back-end")
          print()
          print("**%d testes** | falhas: %d | erros: %d | ignorados: %d" % (total, fail, err, skip))
          print()
          print("| Classe | Testes | Falhas | Erros | Ignorados | Tempo (s) |")
          print("|---|---|---|---|---|---|")
          for row in rows:
              print("| `%s` | %d | %d | %d | %d | %s |" % row)
          PY

      - name: Publicar relatorios de teste e log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-backend
          path: |
            backend-api/smarthas-api/target/surefire-reports/
            backend-api/smarthas-api/mvn-verify.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar o jar gerado
        uses: actions/upload-artifact@v4
        with:
          name: smarthas-api-jar
          path: backend-api/smarthas-api/target/*.jar
          if-no-files-found: error
          retention-days: 14

  oracle-db:
    name: Oracle (scripts e verificacoes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_PASSWORD: CiOracle2026x
      APP_PASSWORD: CiSmartHas2026x

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Subir o Oracle Free (container)
        run: |
          docker run -d --name oracle-ci \
            -e ORACLE_PASSWORD="$ORACLE_PASSWORD" \
            -e APP_USER=smarthas \
            -e APP_USER_PASSWORD="$APP_PASSWORD" \
            gvenzl/oracle-free:23-slim-faststart

      - name: Executar scripts 01 a 07 e verificacoes automaticas
        run: bash database/ci/run_ci.sh

      - name: Resumo das verificacoes do Oracle
        if: always()
        shell: bash
        run: |
          {
            echo "## Oracle: verificacoes automaticas"
            echo
            if [ -f ci-logs/assert_oracle.log ]; then
              echo '```'
              grep -E '^\[(OK|FALHA|ERRO|INFO)\]|^RESULTADO' ci-logs/assert_oracle.log || echo "sem saida"
              echo '```'
            else
              echo "As verificacoes nao chegaram a executar. Veja os logs dos scripts nos artefatos."
            fi
            echo
            echo "Logs completos de cada script: artefato **logs-oracle**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs dos scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-oracle
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Logs do container (somente se falhar)
        if: failure()
        run: docker logs --tail 80 oracle-ci || true

  docker-build:
    name: Imagem Docker (build, varredura e publicacao)
    runs-on: ubuntu-latest
    needs: [build-test, oracle-db]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Definir o nome da imagem (em minusculo, como o GHCR exige)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/smarthas-api" >> "$GITHUB_ENV"

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir a imagem (valida o Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: backend-api/smarthas-api
          load: true
          push: false
          tags: smarthas-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Varredura de vulnerabilidades (Trivy)
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format table --output /reports/trivy-report.txt \
            smarthas-api:ci

      - name: Resumo da imagem
        if: always()
        shell: bash
        run: |
          {
            echo "## Imagem Docker"
            echo
            size=$(docker image inspect smarthas-api:ci --format '{{.Size}}' 2>/dev/null || echo 0)
            echo "- Tamanho da imagem: $((size / 1024 / 1024)) MB"
            if [ "$PUBLICAR" = "true" ]; then
              echo "- Publicada em: \`$IMAGE\` (tags \`latest\` e o hash do commit)"
            else
              echo "- Publicacao: ignorada (so acontece em push na main)"
            fi
            echo
            echo "### Varredura Trivy (HIGH e CRITICAL com correcao disponivel)"
            if [ -f reports/trivy-report.txt ]; then
              echo '```'
              grep -E "^Total:|Report Summary" reports/trivy-report.txt | head -10 || true
              echo '```'
              echo "Relatorio completo: artefato **relatorio-trivy**."
            else
              echo "Varredura nao executada ou sem relatorio."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o relatorio da varredura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Login no GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem no GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend-api/smarthas-api
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    name: Deploy (Oracle FIAP + Render)
    runs-on: ubuntu-latest
    needs: [build-test, oracle-db, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://smarthas.onrender.com' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      ORACLE_HOST: ${{ vars.ORACLE_HOST || 'oracle.fiap.com.br' }}
      ORACLE_PORT: ${{ vars.ORACLE_PORT || '1521' }}
      ORACLE_SID: ${{ vars.ORACLE_SID || 'ORCL' }}
      ORACLE_DEPLOY: ${{ vars.ORACLE_DEPLOY || 'true' }}
      APP_URL: ${{ vars.APP_URL || 'https://smarthas.onrender.com' }}

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java (necessario para o SQLcl)
        if: env.ORACLE_DEPLOY == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Aplicar os scripts 05 e 06 no Oracle da FIAP
        id: oracle
        if: env.ORACLE_DEPLOY == 'true'
        shell: bash
        run: |
          if [ -z "$ORACLE_USER" ] || [ -z "$ORACLE_PASSWORD" ]; then
            echo "::error::Secrets ORACLE_USER e ORACLE_PASSWORD nao configurados no ambiente production"
            exit 1
          fi
          mkdir -p ci-logs
          curl -fsSL -o sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q sqlcl.zip
          DESCR="(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=${ORACLE_HOST})(PORT=${ORACLE_PORT}))(CONNECT_DATA=(SID=${ORACLE_SID})))"
          CONN="${ORACLE_USER}/${ORACLE_PASSWORD}@${DESCR}"

          echo "Testando a conexao com ${ORACLE_HOST}:${ORACLE_PORT}/${ORACLE_SID}..."
          out=$(printf "SELECT 'CONEXAO_OK' FROM dual;\nEXIT\n" | timeout 120 sqlcl/bin/sql -L -S "$CONN" 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q CONEXAO_OK; then
            echo "::error::Nao foi possivel conectar no Oracle (host inacessivel a partir do GitHub ou credenciais invalidas)"
            exit 1
          fi

          run_sql() {
            local script="$1" name
            name="$(basename "${script%.sql}")"
            echo "::group::${script}"
            {
              echo "SET DEFINE OFF"
              echo "SET SQLBLANKLINES ON"
              echo "SET SERVEROUTPUT ON SIZE UNLIMITED"
              echo "@${script}"
              echo "EXIT"
            } | timeout 300 sqlcl/bin/sql -L -S "$CONN" | tee "ci-logs/deploy_${name}.log"
            echo "::endgroup::"
          }

          run_sql database/05_packages.sql
          run_sql database/06_triggers.sql
          run_sql database/ci/verify_deploy.sql

          # garante que a verificacao realmente rodou e nao teve falhas
          grep -Eq "RESULTADO: [0-9]+ verificacoes, 0 falha" ci-logs/deploy_verify_deploy.log

      - name: Disparar o deploy do back-end no Render
        id: render
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL nao configurado no ambiente production"
            exit 1
          fi
          code=$(curl -sS -o render-response.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Resposta do Render: HTTP $code"
          cat render-response.txt || true
          echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Teste de fumaca (aguarda o servico responder)
        id: smoke
        shell: bash
        run: |
          echo "Aguardando o Render publicar a nova versao (o plano gratuito pode demorar)..."
          sleep 90
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$APP_URL/" || true)
            code=${code:-000}
            echo "tentativa $i: HTTP $code"
            # qualquer resposta abaixo de 500 (inclusive 401/403/404) prova que o servico esta de pe
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "Servico respondendo em $APP_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::O servico nao respondeu a tempo em $APP_URL"
          exit 1

      - name: Resumo do deploy
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy em producao"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Oracle da FIAP (scripts 05 e 06 + verificacao) | ${{ steps.oracle.outcome }} |"
            echo "| Render (deploy hook) | ${{ steps.render.outcome }} |"
            echo "| Teste de fumaca | ${{ steps.smoke.outcome }} |"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Aplicacao: $APP_URL"
            if [ -f ci-logs/deploy_verify_deploy.log ]; then
              echo
              echo "### Verificacao do Oracle apos o deploy"
              echo '```'
              grep -E '^\[(OK|FALHA)\]|^RESULTADO' ci-logs/deploy_verify_deploy.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar logs do deploy no Oracle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-deploy-oracle
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 30
