<div class="topo">
  <h1>Minhas Finanças</h1>
  <button class="botao-sair" (click)="sair()">Sair</button>
</div>

<p class="erro" *ngIf="erro()">{{ erro() }}</p>

<div class="filtro-ano">
  <button (click)="anoAnterior()" class="seta-ano">◀</button>
  <input type="number" name="ano" [(ngModel)]="anoSelecionado" class="input-ano" />
  <button (click)="anoSeguinte()" class="seta-ano">▶</button>
</div>

<div *ngIf="carregando()" class="carregando">Carregando...</div>

<div *ngIf="!carregando()" class="dashboard">
  <div class="grafico-container">
    <div class="grafico-pizza" [style.background]="graficoBackground"></div>

    <div class="legenda">
      <div class="legenda-item">
        <span class="bolinha bolinha-renda"></span>
        Receitas — R$ {{ totalRenda.toFixed(2) }} ({{ percentualRenda }}%)
      </div>
      <div class="legenda-item">
        <span class="bolinha bolinha-despesa"></span>
        Despesas — R$ {{ totalDespesa.toFixed(2) }} ({{ 100 - percentualRenda }}%)
      </div>
    </div>
  </div>

  <p *ngIf="transacoesDoAno.length === 0" class="vazio">Nenhuma transação encontrada em {{ anoSelecionado }}.</p>

  <a routerLink="/transacoes" class="botao-ver-lista">Ver lista completa de transações</a>
</div>
